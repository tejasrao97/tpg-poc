# Example restore-patch file in the stored form, referenced by clusters/fleet.example.yaml. tpg-restore
# writes these (<instance>-restore-<uid>.yaml): one kind: Postgres document, the spec of the restored
# Postgres (the spec file of the pair, or the spec read from the cluster after the restore), no metadata.
# The chart renders the Postgres of the restored instance from it.
apiVersion: sql.tanzu.vmware.com/v1
kind: Postgres
spec:
  postgresVersion:
    name: postgres-17.6
  storageSize: 100Gi
  logLevel: Debug
  resources:
    data:
      requests:
        memory: 4Gi
