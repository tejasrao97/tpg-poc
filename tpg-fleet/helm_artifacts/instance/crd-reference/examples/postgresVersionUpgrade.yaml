# Example for helm_artifacts/instance/crd-reference (the 4.5 documentation sample, adapted to the
# fleet names). Render it with:
#   helm template ref helm_artifacts/instance/crd-reference -f helm_artifacts/instance/crd-reference/examples/postgresVersionUpgrade.yaml
postgresVersionUpgrade:
  enabled: true
  name: orders-db-upgrade
  spec:
    postgresInstance: {name: orders-db}
    postgresVersion: {name: postgres-18.1}
