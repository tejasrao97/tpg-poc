# Example for helm_artifacts/instance/crd-reference (the 4.5 documentation sample, adapted to the
# fleet names). Render it with:
#   helm template ref helm_artifacts/instance/crd-reference -f helm_artifacts/instance/crd-reference/examples/postgresBackupSchedule.yaml
postgresBackupSchedule:
  enabled: true
  name: orders-db-backup-full
  spec:
    schedule: 0 0 * * 0
    backupTemplate:
      spec:
        sourceInstance: {name: orders-db}
        type: full
