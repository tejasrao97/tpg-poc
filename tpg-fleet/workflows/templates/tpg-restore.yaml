# Day 1: restore Postgres instances (Round 23, locked decision 7). clusterMap is a LIST of pairs, one
# restore each: the source and the target, <cluster>: <namespace>: <instance>: {keys}, exactly one of
# each side. The target is the instance itself (in place), a new instance in another namespace of the
# source cluster, or a new instance on another cluster (added to clusters/fleet.yaml and adopted by
# Argo CD). The recovery point is a named backup (pitrEnabled false) or point-in-time recovery
# (pitrEnabled true, pitrConfig.type latest, time, lsn or transaction). The keys and their rules are
# in workflows/params/cluster-map-keys.yaml (section restore) and the generated schema
# workflows/params/schemas/clustermap-restore.schema.json.
#
# dryRun is true by default: each pair records its plan (source resolution, the matrix, the
# PostgresRestore that would be created, the preparation of the target) and nothing changes. A real
# restore needs dryRun=false, and confirm (the target instance name) for an in-place pair (confirm is refused on any other pair).
#
# rolloutMode: all (default) runs every pair at once; batches runs maxParallel pairs at a time, in
# the order of the list; canary runs the first pair alone and stops the run when it fails. The
# pairs are independent: a failed pair does not stop the others (except a failed canary), and the
# run ends Failed when any pair FAILED, TIMED OUT or was BLOCKED.
#
# clusterMap example:
#   - sourceClusterConfig:
#       aks-tpg-poc-01:
#         pg-orders:
#           orders-db: {sourceBackupName: orders-db-full-20260914000000}
#     targetClusterConfig:
#       aks-tpg-poc-01:
#         pg-orders:
#           orders-db: {pitrEnabled: false, confirm: orders-db}        # in place
#   - sourceClusterConfig:
#       aks-tpg-poc-01:
#         pg-orders:
#           orders-db: {}
#     targetClusterConfig:
#       aks-tpg-poc-02:
#         pg-orders-dr:
#           orders-db-dr:                                              # a new instance on another cluster
#             pitrEnabled: true
#             bestEffort: true
#             pitrConfig: {type: time, timestamp: 2026-09-15T08:30:00Z}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-restore
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: restore Postgres instances from a list of pairs (clusterMap: source and target, cluster, namespace
      and instance each): in place, into another namespace or onto another cluster, from a named backup or with
      point-in-time recovery (latest, time, lsn, transaction). dryRun=true (default) records the plan per pair;
      rolloutMode all, batches or canary; the pairs are independent.
spec:
  serviceAccountName: tpg-workflow
  # Vault Agent (injector on the hub) renders tpg/shared/broadcom-registry,
  # github-push and backup-storage into /vault/secrets before each step starts
  # (ConfigMap tpg-vault-agent, workflows/vault-agent/config-init.hcl).
  # Steps that need no credentials set agent-inject to "false".
  podMetadata:
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-pre-populate-only: "true"
      vault.hashicorp.com/agent-init-first: "true"
      vault.hashicorp.com/agent-configmap: tpg-vault-agent
      vault.hashicorp.com/tls-secret: vault-ca
  entrypoint: main
  onExit: exit-handler
  parallelism: 10
  arguments:
    parameters:
    # ---- mandatory (no default; the validate step explains what is missing)
    - name: clusterMap
      description: >-
        List of pairs (YAML or JSON), mandatory: - {sourceClusterConfig: {<cluster>: {<namespace>: {<instance>: {sourceBackupName}}}},
        targetClusterConfig: {<cluster>: {<namespace>: {<instance>: {pitrEnabled, pitrConfig, bestEffort, targetInstanceSpecFilePath, confirm,
        skipMinorVersionCheck, postRestoreBackup}}}}}. Example, in place from a named backup:
        [{sourceClusterConfig: {aks-tpg-poc-01: {pg-orders: {orders-db: {sourceBackupName: orders-db-full-20260914000000}}}},
        targetClusterConfig: {aks-tpg-poc-01: {pg-orders: {orders-db: {pitrEnabled: false, confirm: orders-db}}}}}]
      value: ""
    - name: dryRun
      description: "true (default): record the plan of every pair and change nothing; false: restore (an in-place pair needs confirm)"
      value: "true"
      enum: ["true", "false"]
    # ---- optional
    - name: rolloutMode
      description: "all (default): every pair at once; batches: maxParallel pairs at a time, in list order; canary: the first pair alone, a failed canary stops the run, then batches of maxParallel. The pairs are independent"
      value: all
      enum: ["canary", "batches", "all"]
    - name: maxParallel
      description: "Pairs per batch for rolloutMode canary and batches"
      value: "2"
    - name: pushMode
      description: "A new instance is added to clusters/fleet.yaml: direct pushes to the fleet branch; pr opens a pull request and continues once it is merged"
      value: "direct"
      enum: ["direct", "pr"]
    - name: keepSourceLocation
      description: "true (default): the copy of the source PostgresBackupLocation that a restore into another namespace or cluster needs stays in the target namespace; false: remove it after a successful restore"
      value: "true"
      enum: ["true", "false"]
    - name: patchFiles
      description: "JSON map {\"<path>\": \"<base64 contents>\"} of the local files that targetInstanceSpecFilePath names; scripts/submit/pack-patch-files.sh -o <parameter file> writes it"
      value: ""
    - name: restoreTimeoutSeconds
      description: "How long the restore phase of one pair may take: the wait for synced backups (named backup into another namespace or cluster) and for the PostgresRestore to finish. Waiting for the restored instance to run has its own timeout (1800 s)"
      value: "7200"
    - name: prTimeoutSeconds
      value: "3600"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: batches
        templateRef:
          name: tpg-lib
          template: plan-batches
        arguments:
          parameters:
            - name: requirePrecheck
              value: "false"
            - name: maxParallel
              value: "{{workflow.parameters.maxParallel}}"
            - name: rolloutMode
              value: "{{workflow.parameters.rolloutMode}}"
            - name: pairs
              value: "{{steps.validate.outputs.parameters.pairs}}"
    - - name: split
        templateRef:
          name: tpg-lib
          template: split-first
        arguments:
          parameters:
            - name: batches
              value: "{{steps.batches.outputs.parameters.batches}}"
    # canary: the first pair alone; when it fails this step fails and the later groups do not start.
    # Otherwise the first batch runs and a failed pair does not stop the rest (the pairs are independent)
    - - name: canary
        template: restore-batch
        when: "'{{workflow.parameters.rolloutMode}}' == 'canary'"
        arguments:
          parameters:
            - name: items
              value: "{{steps.split.outputs.parameters.first}}"
      - name: first
        template: restore-batch
        when: "'{{workflow.parameters.rolloutMode}}' != 'canary'"
        continueOn:
          failed: true
        arguments:
          parameters:
            - name: items
              value: "{{steps.split.outputs.parameters.first}}"
    - - name: rest
        template: run-batches
        when: "{{steps.split.outputs.parameters.hasRest}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.split.outputs.parameters.rest}}"
    # a FAILED, TIMEOUT or BLOCKED pair ends the run Failed after the others ran
    - - name: gate
        template: gate
  # The batches after the first, one at a time; a failed pair does not stop the next batch
  - name: run-batches
    inputs:
      parameters:
        - name: batches
    steps:
    - - name: split
        templateRef:
          name: tpg-lib
          template: split-first
        arguments:
          parameters:
            - name: batches
              value: "{{inputs.parameters.batches}}"
    - - name: restore
        template: restore-batch
        continueOn:
          failed: true
        arguments:
          parameters:
            - name: items
              value: "{{steps.split.outputs.parameters.first}}"
    - - name: next
        template: run-batches
        when: "{{steps.split.outputs.parameters.hasRest}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.split.outputs.parameters.rest}}"
  # The pairs of one batch, in parallel (one at a time per target instance)
  - name: restore-batch
    inputs:
      parameters:
        - name: items
    steps:
    - - name: restore
        template: restore-pair
        arguments:
          parameters:
            - name: pair
              value: "{{item.pair}}"
            - name: cluster
              value: "{{item.cluster}}"
            - name: namespace
              value: "{{item.namespace}}"
            - name: instance
              value: "{{item.instance}}"
            - name: method
              value: "{{item.method}}"
        withParam: "{{inputs.parameters.items}}"
  - name: validate
    # Vault Agent (the workflow default): the validate step reads clusters/fleet.yaml to check
    # clusters.<cluster>.cluster.allowInPlaceRestore when a pair restores in place
    outputs:
      parameters:
        - name: pairs
          valueFrom:
            path: /tmp/pairs.json
            default: "[]"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, restore]
      env:
        - {name: P_WORKFLOW, value: "{{workflow.name}}"}
        - {name: P_CLUSTER_MAP, value: "{{workflow.parameters.clusterMap}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_ROLLOUT_MODE, value: "{{workflow.parameters.rolloutMode}}"}
        - {name: P_MAX_PARALLEL, value: "{{workflow.parameters.maxParallel}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_KEEP_SOURCE_LOCATION, value: "{{workflow.parameters.keepSourceLocation}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.restoreTimeoutSeconds}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  # One pair: restore-pair.sh reads the normalized pair (P_PAIR, fields in the header of clustermap.py)
  - name: restore-pair
    inputs:
      parameters:
        - name: pair
        - name: cluster
        - name: namespace
        - name: instance
        - name: method
    # one restore at a time per target instance (the lock of the other workflows) and per target cluster and
    # namespace: pairs that restore into one namespace share its Secrets, backup locations and fleet entries and
    # run one after another; pairs of other namespaces stay parallel (up to maxParallel)
    synchronization:
      mutexes:
        - name: "tpg-instance-{{inputs.parameters.cluster}}-{{inputs.parameters.instance}}"
        - name: "tpg-restore-ns-{{inputs.parameters.cluster}}-{{inputs.parameters.namespace}}"
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_restore_result
          help: "Restore result per target cluster and instance"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: instance_name
              value: "{{inputs.parameters.instance}}"
            - key: mode
              value: "{{inputs.parameters.method}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/restore-pair.sh]
      args:
        - "{{workflow.name}}"
      env:
        - {name: P_PAIR, value: "{{inputs.parameters.pair}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_KEEP_SOURCE_LOCATION, value: "{{workflow.parameters.keepSourceLocation}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.restoreTimeoutSeconds}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: gate
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/blocked-gate.sh]
      args:
        - "{{workflow.name}}"
        - failed
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: steps
