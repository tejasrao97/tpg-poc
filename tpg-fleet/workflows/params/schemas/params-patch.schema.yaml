# generated by workflows/params/params_schema.py; do not edit
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/<org>/tpg-fleet/workflows/params/schemas/params-patch.schema.json
title: Parameter file of tpg-patch
description: 'The parameter file of `argo submit --from workflowtemplate/tpg-patch --parameter-file`: the inputs of the WorkflowTemplate tpg-patch. Generated from workflows/params/types.yaml and the template by workflows/params/params_schema.py. The shape, the types, the allowed values and the mandatory inputs; the validate step of the workflow and the admission policy tpg-workflow-parameters remain the authority (inputs that are mandatory in some cases only, combinations, registered clusters, the inside of clusterMap).'
type: object
additionalProperties: false
properties:
  clusterMap:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(\{|[^\s:#][^:]*:)
    description: 'Map (YAML or JSON): cluster -> {operatorValuesPatchFilePath, patchMode, clearKinds, instances: {instance -> {postgresPatchFilePath (a list), postgresValuesPatchFilePath, patchMode, clearKinds}}}; each path a local file whose contents patchFiles carries, or repo:<path>. Schema: workflows/params/schemas/clustermap-patch.schema.json. Example: {aks-tpg-poc-01: {operatorValuesPatchFilePath: ./operator-resources.yaml, instances: {orders-db: {postgresPatchFilePath: [./orders-memory.yaml, ./orders-backup-location.yaml], postgresValuesPatchFilePath: ./orders-backup.yaml}}}} [Map]'
  clusters:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*all\s*$
    - type: string
      pattern: ^\s*(all|\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\])\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: registered clusters in brackets, [aks-tpg-poc-01, aks-tpg-poc-02] (also with one value), or all (without clusterMap) [List; mandatory in some cases (the validate step decides)]'
  instances:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*all\s*$
    - type: string
      pattern: ^\s*(all|\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\])\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: instances in brackets, [orders-db], or all (without clusterMap; needed for instance patch files) [List; mandatory in some cases (the validate step decides)]'
  postgresPatchFilePath:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?(\s*,\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?)*\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml$
    description: 'List in brackets, [./a.yaml, repo:<path>], of .yaml or .yml files: partial manifests, one document per kind (Postgres, PostgresBackupLocation, PostgresBackupSchedule with metadata.name <instance>-backup-full or -incremental, PostgresFerretDocumentDB; apiVersion, kind, spec), each a local file (absolute or relative; contents in patchFiles) or repo:helm_artifacts/instance/tpg-instance/patches/<file>. Combined with the kinds the instance''s current postgres file carries into helm_artifacts/instance/tpg-instance/patches/<instance>-postgres-<hash>.yaml, its new current file [List (file paths); mandatory in some cases (the validate step decides)]'
  postgresValuesPatchFilePath:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml$
      maxItems: 1
    description: 'One .yaml or .yml file in brackets, [./values.yaml] (local, absolute or relative, or repo:helm_artifacts/instance/tpg-instance/patches/<file>): tpg-instance chart values; stored as helm_artifacts/instance/tpg-instance/patches/<name>-<uid>.yaml and made the current postgresValues patch of each instance [List (one file path); mandatory in some cases (the validate step decides)]'
  operatorValuesPatchFilePath:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml$
      maxItems: 1
    description: 'One .yaml or .yml file in brackets, [./operator.yaml] (local, absolute or relative, or repo:helm_artifacts/operator/patches/<file>): operator chart values, only operatorImage (same tag as the cluster''s operator version), instanceRegistryRepo, ferretDBImageRepo, dockerRegistrySecretName, certManagerClusterIssuerName, certManagerNamespace, resources (limits, requests: cpu, memory), enableSecurityContext; stored as helm_artifacts/operator/patches/<name>-<uid>.yaml [List (one file path); mandatory in some cases (the validate step decides)]'
  patchFiles:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\{
    - type: object
      minProperties: 1
      additionalProperties:
        type: string
    description: 'JSON map: the contents of the local patch files, {"<path as given above>": "<base64>"}; filled by scripts/submit/tpg-patch.sh, or written into a parameter file by scripts/submit/pack-patch-files.sh -o FILE. Empty with patchMode=clear and for repo: files [Map (JSON); mandatory in some cases (the validate step decides)]'
  backupCaBundleFile:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.(pem|crt|cer)["\x27]?\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.(pem|crt|cer)$
      maxItems: 1
    description: 'One PEM file in brackets, [./ca.pem] (.pem, .crt, .cer; local, absolute or relative, or repo:ca-bundles/<file>): the new CA bundle of the backup location of every selected instance with enableSSL true (contents in patchFiles); a map key of the instance or its cluster wins. Changing the backup location restarts the instance [List (one file path)]'
  backupCaBundleVaultSecret:
    anyOf:
    - const: ''
    - type: string
      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
    description: 'The name of a CA bundle in Vault (tpg/ca-bundles/<name>, key caBundle; tpg-aks-infra scripts/vault-secret.sh ca put writes it): the new CA bundle of every selected enableSSL instance. Not with backupCaBundleFile [String (name)]'
  patchMode:
    enum:
    - apply
    - clear
    description: 'apply: the files become the current patches (the former current is recorded as previous); clear: the kinds named by clearKinds lose their current file (recorded as previous) [Enum]'
    default: apply
  clearKinds:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(all|\[\s*["\x27]?(Postgres|PostgresBackupLocation|PostgresBackupSchedule|PostgresFerretDocumentDB|postgresValues|operatorValues)["\x27]?(\s*,\s*["\x27]?(Postgres|PostgresBackupLocation|PostgresBackupSchedule|PostgresFerretDocumentDB|postgresValues|operatorValues)["\x27]?)*\s*\])\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(Postgres|PostgresBackupLocation|PostgresBackupSchedule|PostgresFerretDocumentDB|postgresValues|operatorValues)$
    description: 'patchMode=clear: the kinds whose current patch is removed, a list in brackets or all, [Postgres, postgresValues]: Postgres, PostgresBackupLocation, PostgresBackupSchedule, PostgresFerretDocumentDB (documents of the postgres file), postgresValues, operatorValues, or all [List (kinds); mandatory in some cases (the validate step decides)]'
  pushMode:
    enum:
    - direct
    - pr
    description: 'pr: per cluster a branch and pull request, synced before the merge; the workflow waits for a person to merge it (closed or not merged within prTimeoutSeconds: the cluster is synced back and the branch deleted). direct: per cluster a commit on the fleet branch (reverted by a revert commit when the sync or the checks fail) [Enum; mandatory]'
  maxParallel:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: '[Integer]'
    default: '1'
  rolloutMode:
    enum:
    - canary
    - batches
    - all
    description: 'canary: one wave-0 cluster first, then batches of maxParallel; batches: no canary, batches of maxParallel; all: every selected cluster at once [Enum]'
    default: canary
  dryRun:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'true: check the files, render and dry-run every target and print the diff; commit and sync nothing [Boolean]'
    default: 'false'
  timeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: Per operator and per instance [Integer]
    default: '1800'
  prTimeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: 'pushMode=pr: how long to wait for the merge of each cluster''s pull request before the cluster is synced back [Integer]'
    default: '3600'
  toolsImage:
    type: string
    description: '[String]'
    default: alpine/k8s:1.35.8
required:
- pushMode
