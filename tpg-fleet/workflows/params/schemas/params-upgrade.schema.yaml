# generated by workflows/params/params_schema.py; do not edit
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/<org>/tpg-fleet/workflows/params/schemas/params-upgrade.schema.json
title: Parameter file of tpg-upgrade
description: 'The parameter file of `argo submit --from workflowtemplate/tpg-upgrade --parameter-file`: the inputs of the WorkflowTemplate tpg-upgrade. Generated from workflows/params/types.yaml and the template by workflows/params/params_schema.py. The shape, the types, the allowed values and the mandatory inputs; the validate step of the workflow and the admission policy tpg-workflow-parameters remain the authority (inputs that are mandatory in some cases only, combinations, registered clusters, the inside of clusterMap).'
type: object
additionalProperties: false
properties:
  component:
    enum:
    - operator
    - postgres
    - ''
    description: 'operator: Tanzu Postgres operator; postgres: Postgres instances. With clusterMap: optional, limits the run to one part [Enum; mandatory in some cases (the validate step decides)]'
  targetVersion:
    anyOf:
    - const: ''
    - type: string
      pattern: ^(v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?|(postgres-)?[0-9]+(\.[0-9]+)?)$
    description: 'operator: chart version such as v4.5.0; postgres: PostgresVersion such as postgres-17.6. With clusterMap: the default of the component [String (version); mandatory in some cases (the validate step decides)]'
  clusters:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*all\s*$
    - type: string
      pattern: ^\s*(all|\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\])\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: registered clusters in brackets, [aks-tpg-poc-01, aks-tpg-poc-02] (also with one value), or all (without clusterMap) [List; mandatory in some cases (the validate step decides)]'
  pushMode:
    enum:
    - direct
    - pr
    description: 'direct: push to the fleet branch; pr: open a pull request and continue after it is merged [Enum; mandatory]'
  instances:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*all\s*$
    - type: string
      pattern: ^\s*(all|\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\])\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: component=postgres only (mandatory there): instances in brackets, [orders-db], or all (without clusterMap) [List; mandatory in some cases (the validate step decides)]'
  clusterMap:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(\{|[^\s:#][^:]*:)
    description: 'Map (YAML or JSON): cluster -> {operatorVersion, instances: {instance -> {postgresVersion, preUpgradeBackup, allowMajor}}}; the operator first, then the instances [Map]'
  preUpgradeBackup:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: Full backup of each affected instance before the upgrade [Boolean]
    default: 'true'
  allowMajor:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'component=postgres: allow major version upgrades (for example 16 to 17) [Boolean]'
    default: 'false'
  maxParallel:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: '[Integer]'
    default: '1'
  rolloutMode:
    enum:
    - canary
    - batches
    - all
    description: 'canary: one wave-0 cluster first, then batches of maxParallel; batches: no canary, batches of maxParallel; all: every selected cluster at once [Enum]'
    default: canary
  dryRun:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'true: validate and record the planned upgrade per target; change nothing [Boolean]'
    default: 'false'
  timeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: Per-cluster (operator) or per-instance (postgres) timeout [Integer]
    default: '1800'
  prTimeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: '[Integer]'
    default: '3600'
  toolsImage:
    type: string
    description: '[String]'
    default: alpine/k8s:1.35.8
required:
- pushMode
