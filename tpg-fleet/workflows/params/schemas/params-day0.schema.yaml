# generated by workflows/params/params_schema.py; do not edit
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/<org>/tpg-fleet/workflows/params/schemas/params-day0.schema.json
title: Parameter file of tpg-day0
description: 'The parameter file of `argo submit --from workflowtemplate/tpg-day0 --parameter-file`: the inputs of the WorkflowTemplate tpg-day0. Generated from workflows/params/types.yaml and the template by workflows/params/params_schema.py. The shape, the types, the allowed values and the mandatory inputs; the validate step of the workflow and the admission policy tpg-workflow-parameters remain the authority (inputs that are mandatory in some cases only, combinations, registered clusters, the inside of clusterMap).'
type: object
additionalProperties: false
properties:
  clusters:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*all\s*$
    - type: string
      pattern: ^\s*(all|\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\])\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: registered clusters in brackets, [aks-tpg-poc-01, aks-tpg-poc-02] (also with one value), or all (without clusterMap) [List; mandatory in some cases (the validate step decides)]'
  instances:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\]\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: Postgres instances to deploy, in brackets, [orders-db], on every selected cluster, namespace pg-<instance> (the clusterMap key namespace sets another one; without clusterMap) [List; mandatory in some cases (the validate step decides)]'
  clusterMap:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(\{|[^\s:#][^:]*:)
    description: 'Map (YAML or JSON): cluster -> {operatorVersion, maxReadReplicas, operatorValuesOverlayFilePath, instances: {instance -> {postgresVersion, highAvailability, readReplicas, storageSize, walStorageSize, storageClass, cpu, memory, backupSchedule, operatorFullSchedule, operatorIncrementalSchedule, backupEnableSSL, backupCaBundleFile, backupCaBundleVaultSecret, backupFullRetention, backupFullRetentionType, ferret, ferretReplicas, ferretReadOnlyReplicas, ferretExposure, ferretSecretName, ferretReadOnlySecretName, postgresOverlayFilePath (a list), postgresValuesOverlayFilePath, exposure, serviceAnnotations, readOnlyExposure, readOnlyServiceAnnotations, allowedSourceRanges, internalLoadBalancerSubnet, networkPolicy, ingressFromNamespaces, ingressFromPodLabels, ingressFromCidrs, egressToCidrs, egressToFqdns}}}; the inputs below are the defaults. Schema: workflows/params/schemas/clustermap-day0.schema.json [Map]'
  highAvailability:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    - ''
    description: 'Boolean. true: primary and standby (plus readReplicas); false: single node [Boolean; mandatory in some cases (the validate step decides)]'
  operatorVersion:
    anyOf:
    - const: ''
    - type: string
      pattern: ^v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$
    description: Tanzu Postgres operator chart version, for example v4.5.0 [String (version); mandatory in some cases (the validate step decides)]
  postgresVersion:
    anyOf:
    - const: ''
    - type: string
      pattern: ^(postgres-)?[0-9]+(\.[0-9]+)?$
    description: PostgresVersion name, for example postgres-17.6 (17.6 is accepted) [String (version); mandatory in some cases (the validate step decides)]
  pushMode:
    enum:
    - direct
    - pr
    description: 'direct: push to the fleet branch; pr: open a pull request and continue after it is merged [Enum; mandatory]'
  readReplicas:
    anyOf:
    - const: ''
    - type: integer
      minimum: 0
    - type: string
      pattern: ^[0-9]+$
    description: 'Read replicas per instance, only with highAvailability=true: 1 to maxReadReplicas (empty: 1). With highAvailability=false leave it empty or 0; above 0 is refused [Integer]'
  storageSize:
    anyOf:
    - const: ''
    - type: integer
      minimum: 0
    - type: string
      pattern: ^[0-9]+(\.[0-9]+)?(m|Ki|Mi|Gi|Ti|Pi|k|M|G|T|P)?$
    description: 'Data volume size, for example 50Gi (empty: clusters/_template/instance.yaml) [String (quantity)]'
  walStorageSize:
    anyOf:
    - const: ''
    - type: integer
      minimum: 0
    - type: string
      pattern: ^[0-9]+(\.[0-9]+)?(m|Ki|Mi|Gi|Ti|Pi|k|M|G|T|P)?$
    description: 'WAL volume size (empty: template default) [String (quantity)]'
  storageClass:
    anyOf:
    - const: ''
    - type: string
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    description: 'StorageClass for data and WAL volumes (empty: template default tpg-data-retain) [String (name)]'
  cpu:
    anyOf:
    - const: ''
    - type: integer
      minimum: 0
    - type: string
      pattern: ^[0-9]+(\.[0-9]+)?(m|Ki|Mi|Gi|Ti|Pi|k|M|G|T|P)?$
    description: 'CPU request and limit per Postgres pod, for example 2 (empty: template default) [String (quantity)]'
  memory:
    anyOf:
    - const: ''
    - type: integer
      minimum: 0
    - type: string
      pattern: ^[0-9]+(\.[0-9]+)?(m|Ki|Mi|Gi|Ti|Pi|k|M|G|T|P)?$
    description: 'Memory request and limit per Postgres pod, for example 4Gi (empty: template default) [String (quantity)]'
  backupSchedule:
    enum:
    - fleet
    - none
    - operator
    description: 'fleet: include in the tpg-backup-full and tpg-backup-incr CronWorkflows; none: exclude; operator: PostgresBackupSchedule objects on operatorFullSchedule and operatorIncrementalSchedule instead of the CronWorkflows (D70) [Enum]'
    default: fleet
  operatorFullSchedule:
    type: string
    pattern: ^\s*[0-9*/,A-Za-z-]+(\s+[0-9*/,A-Za-z-]+){4}\s*$
    description: 'backupSchedule=operator: cron schedule (UTC) of the full backups [String (cron)]'
    default: 0 0 * * 0
  operatorIncrementalSchedule:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*[0-9*/,A-Za-z-]+(\s+[0-9*/,A-Za-z-]+){4}\s*$
    description: 'backupSchedule=operator: cron schedule (UTC) of the incremental backups (empty: full backups only) [String (cron)]'
    default: 0 0 * * 1-6
  ferret:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    - ''
    description: 'Boolean. true: a PostgresFerretDocumentDB for each instance (Postgres 17.5 or later; the DBA prepares the documentdb extension); false: none (removes it); empty: an existing instance keeps what it has [Boolean]'
  ferretReplicas:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: FerretDB read-write proxies (1 or more) [Integer]
    default: '1'
  ferretReadOnlyReplicas:
    anyOf:
    - type: integer
      minimum: 0
    - type: string
      pattern: ^[0-9]+$
    description: 'FerretDB read-only proxies on the standby (0: none; above 0 needs highAvailability=true) [Integer]'
    default: '0'
  ferretExposure:
    enum:
    - clusterIP
    - internalLoadBalancer
    - loadBalancer
    - ''
    description: 'FerretDB Services: clusterIP (default), internalLoadBalancer or loadBalancer (with the instance''s allowedSourceRanges and internalLoadBalancerSubnet) [Enum]'
  ferretSecretName:
    anyOf:
    - const: ''
    - type: string
      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
    description: 'Connection Secret of the read-write proxies (empty: <instance>-app-user-db-secret) [String (name)]'
  ferretReadOnlySecretName:
    anyOf:
    - const: ''
    - type: string
      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
    description: 'Connection Secret of the read-only proxies (empty: <instance>-read-only-user-db-secret) [String (name)]'
  installAddons:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: Install cert-manager, the Vault Secrets Operator (and the standalone monitoring agent) as Helm releases, after the add-on pre-check [Boolean]
    default: 'true'
  existingAddons:
    enum:
    - skip
    - upgrade
    description: 'installAddons: add-on releases that already exist with a different chart version or values: skip or upgrade [Enum]'
    default: skip
  monitoringOption:
    enum:
    - none
    - azure
    - standalone
    - ''
    description: 'Override tpg-settings monitoringOption for installAddons: none, azure or standalone [Enum]'
  maxParallel:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: '[Integer]'
    default: '2'
  rolloutMode:
    enum:
    - canary
    - batches
    - all
    description: 'canary: one wave-0 cluster first, then batches of maxParallel; batches: no canary, batches of maxParallel; all: every selected cluster at once [Enum]'
    default: canary
  backupEnableSSL:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'PostgresBackupLocation enableSSL for the new instances: false (plain HTTP to Azure Blob; needs an account that allows HTTP) or true (HTTPS; the storage account CA bundle from tpg-settings is written as caBundle) [Boolean]'
    default: 'false'
  disableInitialBackup:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'true: the new Postgres instances get the annotation sql.tanzu.vmware.com/skip-initial-backup: "true", so the operator takes no initial backup at creation (the first backup then comes from the schedule or tpg-backup); false: the operator''s default. Only new instances: a running instance is not changed [Boolean]'
    default: 'false'
  exposure:
    enum:
    - clusterIP
    - internalLoadBalancer
    - loadBalancer
    - ''
    description: 'Read-write Service: clusterIP (default), internalLoadBalancer (Azure internal load balancer) or loadBalancer (public; set allowedSourceRanges) [Enum]'
  serviceAnnotations:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(\{|[^\s:#][^:]*:)
    description: 'Map (YAML or JSON): extra annotations of the read-write Service, for example {service.beta.kubernetes.io/azure-dns-label-name: orders} [Map]'
  readOnlyExposure:
    enum:
    - clusterIP
    - internalLoadBalancer
    - loadBalancer
    - ''
    description: 'Read-only Service of an HA instance: clusterIP (default), internalLoadBalancer or loadBalancer [Enum]'
  readOnlyServiceAnnotations:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(\{|[^\s:#][^:]*:)
    description: 'Map (YAML or JSON): extra annotations of the read-only Service [Map]'
  allowedSourceRanges:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?[0-9A-Fa-f:.]+/[0-9]{1,3}["\x27]?(\s*,\s*["\x27]?[0-9A-Fa-f:.]+/[0-9]{1,3}["\x27]?)*\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[0-9A-Fa-f:.]+/[0-9]{1,3}$
    description: 'List of CIDRs in brackets, [10.20.0.0/16]: allowed to reach a load balancer Service (Azure annotation azure-allowed-ip-ranges) [List (CIDRs)]'
  internalLoadBalancerSubnet:
    anyOf:
    - const: ''
    - type: string
      pattern: ^[A-Za-z0-9]([-A-Za-z0-9_.]{0,78}[A-Za-z0-9_])?$
    description: 'internalLoadBalancer: the subnet of the cluster VNet for the load balancer IP (empty: the node subnet) [String (Azure name)]'
  networkPolicy:
    enum:
    - none
    - baseline
    - ''
    description: 'none (default): no policy; baseline: default deny plus the flows the instance needs, then the rules below [Enum]'
  ingressFromNamespaces:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\]\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List in brackets, [orders-app]: namespaces whose pods may connect on 5432 [List]'
  ingressFromPodLabels:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(\{|[^\s:#][^:]*:)
    description: 'Map (YAML or JSON): pod labels allowed to connect on 5432 (in ingressFromNamespaces, or any namespace) [Map]'
  ingressFromCidrs:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?[0-9A-Fa-f:.]+/[0-9]{1,3}["\x27]?(\s*,\s*["\x27]?[0-9A-Fa-f:.]+/[0-9]{1,3}["\x27]?)*\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[0-9A-Fa-f:.]+/[0-9]{1,3}$
    description: 'List of CIDRs in brackets, [10.30.0.0/24]: allowed to connect on 5432 (clients outside the cluster, through a load balancer) [List (CIDRs)]'
  egressToCidrs:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?[0-9A-Fa-f:.]+/[0-9]{1,3}["\x27]?(\s*,\s*["\x27]?[0-9A-Fa-f:.]+/[0-9]{1,3}["\x27]?)*\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[0-9A-Fa-f:.]+/[0-9]{1,3}$
    description: 'List of CIDRs in brackets, [10.40.0.0/24]: extra CIDRs the instance pods may reach [List (CIDRs)]'
  egressToFqdns:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(\*\.)?[a-z0-9.-]+\.[a-z]{2,}["\x27]?(\s*,\s*["\x27]?(\*\.)?[a-z0-9.-]+\.[a-z]{2,}["\x27]?)*\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(\*\.)?[a-z0-9.-]+\.[a-z]{2,}$
    description: 'List in brackets, [api.example.com, *.example.org]: host names the instance pods may reach (CiliumNetworkPolicy toFQDNs; needs ACNS) [List (host names)]'
  postgresOverlayFilePath:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?(\s*,\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?)*\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml$
    description: 'List in brackets, [./a.yaml, repo:<path>], of .yaml or .yml files: partial manifests merged into the instances this run creates, one document per kind (Postgres, PostgresBackupLocation, PostgresBackupSchedule with metadata.name <instance>-backup-full or -incremental, PostgresFerretDocumentDB; apiVersion, kind, spec), each a local file (absolute or relative; contents in patchFiles) or repo:helm_artifacts/instance/tpg-instance/overlays/<file>; combined into helm_artifacts/instance/tpg-instance/overlays/<instance>-postgres-<hash>.yaml, the instance''s current postgres overlay (applied at the initial deployment; tpg-patch patches stack on top). A running instance whose current overlay differs: use tpg-patch [List (file paths)]'
  postgresValuesOverlayFilePath:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml$
      maxItems: 1
    description: 'One .yaml or .yml file in brackets, [./values.yaml] (local, absolute or relative, or repo:helm_artifacts/instance/tpg-instance/overlays/<file>): tpg-instance chart values for the instances this run creates; stored as helm_artifacts/instance/tpg-instance/overlays/<name>-<uid>.yaml and recorded as their current postgresValues overlay [List (one file path)]'
  operatorValuesOverlayFilePath:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml["\x27]?\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.ya?ml$
      maxItems: 1
    description: 'One .yaml or .yml file in brackets, [./operator.yaml] (local, absolute or relative, or repo:helm_artifacts/operator/overlays/<file>): operator chart values for the operator this run installs, only operatorImage (same tag as operatorVersion), instanceRegistryRepo, ferretDBImageRepo, dockerRegistrySecretName, certManagerClusterIssuerName, certManagerNamespace, resources, enableSecurityContext; stored as helm_artifacts/operator/overlays/<name>-<uid>.yaml. A running operator whose current overlay differs: use tpg-patch [List (one file path)]'
  patchFiles:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\{
    - type: object
      minProperties: 1
      additionalProperties:
        type: string
    description: 'JSON map: the contents of the local overlay (and patch) files, {"<path as given above>": "<base64>"}; filled by scripts/submit/tpg-day0.sh, or written into a parameter file by scripts/submit/pack-patch-files.sh -o FILE [Map (JSON)]'
  backupCaBundleFile:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.(pem|crt|cer)["\x27]?\s*\]\s*$
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^(repo:)?(/|~/)?((\.\.?|[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)/)*[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*\.(pem|crt|cer)$
      maxItems: 1
    description: 'One PEM file in brackets, [./ca.pem] (.pem, .crt, .cer; local, absolute or relative, or repo:ca-bundles/<file>): the CA bundle of the storage account for the backupEnableSSL=true instances (contents in patchFiles); empty: backupCaBundleVaultSecret, else ConfigMap tpg-settings backupCaBundle. A clusterMap key of the instance or its cluster wins [List (one file path)]'
  backupCaBundleVaultSecret:
    anyOf:
    - const: ''
    - type: string
      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
    description: The name of a CA bundle in Vault (tpg/ca-bundles/<name>, key caBundle; tpg-aks-infra scripts/vault-secret.sh ca put writes it) for the backupEnableSSL=true instances. Not with backupCaBundleFile [String (name)]
  backupFullRetention:
    anyOf:
    - const: ''
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: 'PostgresBackupLocation retentionPolicy.fullRetention.number for the new instances: a count of full backups (backupFullRetentionType count) or days (time); empty: clusters/_template/cluster.yaml (4) [Integer]'
  backupFullRetentionType:
    enum:
    - count
    - time
    - ''
    description: 'count: keep the newest backupFullRetention full backups; time: keep full backups for backupFullRetention days; empty: the template (count). Changing it later restarts the instance (tpg-patch values file) [Enum]'
  dryRun:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'true: validate, plan the fleet.yaml change and pre-check; push and deploy nothing [Boolean]'
    default: 'false'
  syncTimeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: '[Integer]'
    default: '1800'
  prTimeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: 'pushMode=pr: how long to wait for the pull request merge [Integer]'
    default: '3600'
  toolsImage:
    type: string
    description: '[String]'
    default: alpine/k8s:1.35.8
required:
- pushMode
