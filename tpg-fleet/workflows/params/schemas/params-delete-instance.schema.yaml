title: Parameter file of tpg-delete-instance
description: 'The parameter file of `argo submit --from workflowtemplate/tpg-delete-instance --parameter-file`: the inputs of the WorkflowTemplate tpg-delete-instance. Generated from workflows/params/types.yaml and the template by workflows/params/params_schema.py. The shape, the types, the allowed values and the mandatory inputs; the validate step of the workflow and the admission policy tpg-workflow-parameters remain the authority (inputs that are mandatory in some cases only, combinations, registered clusters, the inside of clusterMap).'
type: object
additionalProperties: false
properties:
  clusters:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\]\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: registered clusters in brackets, [aks-tpg-poc-01] (also with one value) (without clusterMap) [List; mandatory in some cases (the validate step decides)]'
  instances:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\]\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List: instances to delete, in brackets, [orders-db], on every listed cluster; each must be declared there (without clusterMap) [List; mandatory in some cases (the validate step decides)]'
  clusterMap:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*(\{|[^\s:#][^:]*:)
    description: 'Map (YAML or JSON): cluster -> {instances: {instance -> {purgePvcs, purgeNamespace, purgeBackups, finalBackup}}}; the inputs below are the defaults [Map]'
  confirm:
    anyOf:
    - type: string
      pattern: ^\s*\[\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?(\s*,\s*["\x27]?[a-z0-9]([-a-z0-9]*[a-z0-9])?["\x27]?)*\s*\]\s*$
      not:
        pattern: (^|,)[\[\s"\x27]*all[\]\s"\x27]*(,|$)
    - type: array
      minItems: 1
      items:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        not:
          const: all
    description: 'List in brackets: repeat the instances value (without clusterMap) or the cluster names of clusterMap, for example [orders-db] [List; mandatory]'
  forceDeleteStuckApps:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'true: an Application that cannot be rendered (ComparisonError, for example an expired registry token) and stays in Deleting is removed by clearing its Argo CD finalizer; false: the run fails with APPLICATION_NOT_REMOVED [Boolean]'
    default: 'true'
  finalBackup:
    enum:
    - 'true'
    - 'false'
    - required
    - true
    - false
    description: '[Enum]'
    default: 'true'
