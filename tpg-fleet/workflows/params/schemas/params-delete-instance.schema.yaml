    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: Delete PVCs and their Azure disks (irreversible) [Boolean]
    default: 'false'
  purgeNamespace:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: Delete the instance namespace (needs purgePvcs=true; refused while another instance uses the namespace) [Boolean]
