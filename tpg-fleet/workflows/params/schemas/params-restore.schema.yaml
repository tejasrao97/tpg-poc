# generated by workflows/params/params_schema.py; do not edit
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/<org>/tpg-fleet/workflows/params/schemas/params-restore.schema.json
title: Parameter file of tpg-restore
description: 'The parameter file of `argo submit --from workflowtemplate/tpg-restore --parameter-file`: the inputs of the WorkflowTemplate tpg-restore. Generated from workflows/params/types.yaml and the template by workflows/params/params_schema.py. The shape, the types, the allowed values and the mandatory inputs; the validate step of the workflow and the admission policy tpg-workflow-parameters remain the authority (inputs that are mandatory in some cases only, combinations, registered clusters, the inside of clusterMap).'
type: object
additionalProperties: false
properties:
  clusterMap:
    type: string
    pattern: ^\s*(\[|-\s)
    description: 'List of pairs (YAML or JSON), mandatory: - {sourceClusterConfig: {<cluster>: {<namespace>: {<instance>: {sourceBackupName}}}}, targetClusterConfig: {<cluster>: {<namespace>: {<instance>: {pitrEnabled, pitrConfig, bestEffort, targetInstanceSpecFilePath, confirm, skipMinorVersionCheck, postRestoreBackup}}}}}. Example, in place from a named backup: [{sourceClusterConfig: {aks-tpg-poc-01: {pg-orders: {orders-db: {sourceBackupName: orders-db-full-20260914000000}}}}, targetClusterConfig: {aks-tpg-poc-01: {pg-orders: {orders-db: {pitrEnabled: false, confirm: orders-db}}}}}] [List (pairs); mandatory]'
  dryRun:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'true (default): record the plan of every pair and change nothing; false: restore (an in-place pair needs confirm) [Boolean]'
    default: 'true'
  rolloutMode:
    enum:
    - canary
    - batches
    - all
    description: 'all (default): every pair at once; batches: maxParallel pairs at a time, in list order; canary: the first pair alone, a failed canary stops the run, then batches of maxParallel. The pairs are independent [Enum]'
    default: all
  maxParallel:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: Pairs per batch for rolloutMode canary and batches [Integer]
    default: '2'
  pushMode:
    enum:
    - direct
    - pr
    description: 'A new instance is added to clusters/fleet.yaml: direct pushes to the fleet branch; pr opens a pull request and continues once it is merged [Enum]'
    default: direct
  keepSourceLocation:
    enum:
    - true
    - false
    - 'true'
    - 'false'
    description: 'true (default): the copy of the source PostgresBackupLocation that a restore into another namespace or cluster needs stays in the target namespace; false: remove it after a successful restore [Boolean]'
    default: 'true'
  patchFiles:
    anyOf:
    - const: ''
    - type: string
      pattern: ^\s*\{
    - type: object
      minProperties: 1
      additionalProperties:
        type: string
    description: 'JSON map {"<path>": "<base64 contents>"} of the local files that targetInstanceSpecFilePath names; scripts/submit/pack-patch-files.sh -o <parameter file> writes it [Map (JSON); mandatory in some cases (the validate step decides)]'
  restoreTimeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: 'How long the restore phase of one pair may take: the wait for synced backups (named backup into another namespace or cluster) and for the PostgresRestore to finish. Waiting for the restored instance to run has its own timeout (1800 s) [Integer]'
    default: '7200'
  prTimeoutSeconds:
    anyOf:
    - type: integer
      minimum: 1
    - type: string
      pattern: ^[1-9][0-9]*$
    description: '[Integer]'
    default: '3600'
  toolsImage:
    type: string
    description: '[String]'
    default: alpine/k8s:1.35.8
required:
- clusterMap
