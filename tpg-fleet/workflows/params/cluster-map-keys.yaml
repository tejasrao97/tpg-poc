# Keys accepted in the clusterMap input of the tpg workflows.
#
# clusterMap is optional on tpg-day0, tpg-create-instance, tpg-upgrade,
# tpg-patch, tpg-backup, tpg-scale-instance,
# tpg-delete-instance, tpg-delete-apps and tpg-network-policy, and the only input of
# tpg-backup-expire (Round 23). It selects the targets (clusters and the instances on each)
# and carries per-cluster and per-instance values:
#
#   <cluster>:                     a registered cluster
#     <cluster key>: <value>       keys under "cluster" below
#     instances:
#       <instance>:                a DNS label (namespace pg-<instance>)
#         <instance key>: <value>  keys under "instance" below
#
# Written as YAML or JSON. Every key is checked by workflows/scripts/clustermap.py
# in the validate step: its type, whether the workflow accepts it, and whether a
# required value is present (the map key, else the workflow input named in
# "flag"). An unknown key fails the run with the closest known key.
#
# Adding a key is one entry here:
#   type       string | name | namespace (a DNS label of at most 63 characters; "reserved" lists the
#              refused names) | boolean | integer | posint | quantity | enum |
#              operatorVersion | postgresVersion |
#              patchFile (one .yaml/.yml file, in brackets: [./a.yaml]; a path of the
#                submitting machine, absolute or relative, whose contents come in
#                patchFiles, or repo:<path> in the fleet repository) |
#              patchFileList (a list of such files: [./a.yaml, repo:<path>]) |
#              caFile (one PEM file, in brackets: a path of the submitting machine or
#                repo:<path>, .pem, .crt or .cer) |
#              kindList (Postgres, PostgresBackupLocation, PostgresBackupSchedule,
#                PostgresFerretDocumentDB, postgresValues, operatorValues, or all) |
#              nameList (DNS labels) | k8sNameList (Kubernetes object names, as PostgresBackup names) | cidrList (IPv4/IPv6 CIDRs) |
#              fqdnList (host names, * allowed as the first label) |
#              stringMap (annotation or label keys to string values) |
#              cron (5 fields; allowNone: true also takes none or an empty value) |
#              k8sName (a Kubernetes object name)
#              A list is a YAML/JSON sequence, also with one value ([tpg-poc-01]);
#              a comma-separated string is refused with the list syntax (Round 23).
#              patchFile and caFile are a sequence of exactly one path. kindList
#              also takes the bare word all. A file entry with whitespace ("repo: x.yaml",
#              which YAML reads as a mapping) fails with
#              repo:<file path> "check for white spaces in between". A stringMap is a
#              YAML/JSON mapping. Neither may be empty: a key that should no longer
#              apply is removed, not set to [] or {} (an empty value cannot clear a
#              value set at a lower level).
#   values     enum only: the accepted values
#   repoDir    patchFile, patchFileList: the folder a repo:<path> must be in
#   workflows  workflow -> required | optional | guard
#              required: the key or the workflow input "flag" must be set
#              optional: used when set, otherwise the workflow input "flag" applies
#              guard:    when set, a target whose live value differs is skipped
#                        (SKIPPED_VERSION_MISMATCH); nothing is changed
#   doc        one sentence for the generated key reference (docs/workflow-commands.md,
#              section 3) and the descriptions of the clusterMap schemas
#   flag       the workflow input that supplies the default (default: the key name)
#   fleet      tpg-day0, tpg-create-instance and tpg-network-policy: clusters/fleet.yaml
#              paths the value is written to,
#              relative to clusters.<cluster> or clusters.<cluster>.instances.<instance>
#   format     tpg-day0 and tpg-create-instance: how the value is written:
#              string (default) | number | boolean | list | map
# A key with "fleet" needs no code: fleet-day0.sh writes it. Keys without "fleet"
# are read by the step script of each workflow that lists them.
#
# renamed: keys that were renamed (Round 15); the old name is refused with the new one.
#
# restore (Round 23, phase 6): the clusterMap of tpg-restore is not a map of clusters but a LIST of
# pairs, so it has its own section at the end of this file and is not one of "workflows" above.
# Each pair is {sourceClusterConfig, targetClusterConfig}, and each side is
# <cluster>: <namespace>: <instance>: {keys}, exactly one of each. "source" and "target" list the
# keys of the instance level of each side; a key written "a.b.c" sits under a, then b (pitrConfig:
# {type: ...}). Each entry has type (as above, plus timestamp, lsn, stanzaName and backupLabel), doc
# and optionally values. The rules between the keys (which key is required, refused or restricted
# by pitrEnabled and pitrConfig.type, one file, confirm, ...) are in clustermap.py restore
# (process_restore) and, where a schema can say them, in the generated
# workflows/params/schemas/clustermap-restore.schema.json; the namespace of the target follows the
# namespace key above (reserved, reservedPrefixes).
version: 1

renamed:
  valuesPatchFilePath: postgresValuesPatchFilePath
  enableSSL: backupEnableSSL

workflows:
  - day0
  - create-instance
  - upgrade
  - patch
  - backup
  - scale
  - delete-instance
  - delete-apps
  - network-policy
  - backup-expire

cluster:
  operatorVersion:
    doc: "Operator chart version of the cluster. tpg-day0: required (the key or the input operatorVersion); tpg-upgrade: the version to upgrade this cluster to"
    type: operatorVersion
    workflows: {day0: required, upgrade: optional}
    fleet: [.operator.version]
    format: operatorVersion
  maxReadReplicas:
    doc: "The cap on readReplicas of every instance of the cluster (clusters.<c>.cluster.maxReadReplicas, template default 3), 1 or more. tpg-scale-instance: the input maxReadReplicas is its default, and a cluster entry may carry it without instances (only the cap changes)"
    # the cap on readReplicas of every instance of the cluster (default 3).
    # tpg-scale-instance (Round 14, D80) writes it through scale-instance.sh and
    # takes the input of the same name as its default; tpg-day0 and
    # tpg-create-instance have no input for it
    type: posint
    workflows: {day0: optional, create-instance: optional, scale: optional}
    fleet: [.cluster.maxReadReplicas]
    format: number
  operatorValuesPatchFilePath:
    doc: "An operator values file: a path of the submitting machine (its contents in patchFiles) or repo:helm_artifacts/operator/patches/<file>. tpg-patch: it becomes the current operator values patch file, applied on top of the operator overlay of tpg-day0"
    # a file of the submitting machine (its contents come in patchFiles) or
    # repo:helm_artifacts/operator/patches/<file>; stored as helm_artifacts/operator/patches/<name>-<uid>.yaml.
    type: patchFile
    repoDir: helm_artifacts/operator/patches/
    workflows: {patch: optional}
  operatorValuesOverlayFilePath:
    doc: "An operator values overlay file (Round 22; tpg-day0 only; was operatorValuesPatchFilePath): a path of the submitting machine (its contents in patchFiles) or repo:helm_artifacts/operator/overlays/<file>. Applied when the run installs the operator, recorded as clusters.<c>.operator.overlays.values; an operator that runs with another overlay is BLOCKED OVERLAY_USE_TPG_PATCH (use tpg-patch operatorValuesPatchFilePath, which stacks on top)"
    # stored as helm_artifacts/operator/overlays/<name>-<uid>.yaml; the tpg-operator ApplicationSet reads
    # helm_artifacts/operator/overlays/clusters/<cluster>.yaml before the patch copy
    type: patchFile
    repoDir: helm_artifacts/operator/overlays/
    workflows: {day0: optional}
  patchMode:
    doc: "apply or clear, for the operator file of this cluster and the default of its instances"
    # apply | clear (Round 14); the default of the cluster's instances too
    type: enum
    values: [apply, clear]
    workflows: {patch: optional}
  backupCaBundleFile:
    doc: "The backup CA bundle of the cluster's instances with backupEnableSSL: a PEM file of the submitting machine (its contents in patchFiles) or repo:ca-bundles/<file>. Not together with backupCaBundleVaultSecret on this level; an instance key wins"
    # enableSSL instances (Round 15, D86): the CA bundle of the storage account as a
    # PEM file of the submitting machine (contents in patchFiles) or
    # repo:ca-bundles/<file>. The most specific level wins (instance key, cluster
    # key, input); a file and a Vault secret on one level are refused.
    # tpg-patch: replaces the bundle of running enableSSL instances
    type: caFile
    repoDir: ca-bundles/
    flag: ""
    workflows: {day0: optional, create-instance: optional, patch: optional}
  backupCaBundleVaultSecret:
    doc: "The backup CA bundle from Vault tpg/ca-bundles/<name> (key caBundle; tpg-aks-infra scripts/vault-secret.sh ca put). Not together with backupCaBundleFile on this level; an instance key wins"
    # the CA bundle from Vault: tpg/ca-bundles/<name>, key caBundle (Round 15, D86;
    # tpg-aks-infra scripts/vault-secret.sh ca put <name> <file> writes it)
    type: k8sName
    flag: ""
    workflows: {day0: optional, create-instance: optional, patch: optional}
  clearKinds:
    doc: "patchMode=clear: the kinds whose current file is removed. operatorValues clears the operator file of the cluster; instance kinds are the default of its instances"
    # patchMode=clear (Round 15): the kinds whose current patch is removed;
    # operatorValues here, the instance kinds as the default of the cluster's instances
    type: kindList
    workflows: {patch: optional}
  deleteOperator:
    doc: "true deletes the operator and its CRDs after the listed instances"
    type: boolean
    workflows: {delete-apps: optional}
    flag: ""
  force:
    doc: "As the force input, for this cluster"
    type: boolean
    workflows: {delete-apps: optional}

instance:
  postgresVersion:
    doc: "tpg-day0, tpg-create-instance and tpg-upgrade: the version to deploy or upgrade to. Guard in the other workflows: when set, an instance that runs another version is skipped (SKIPPED_VERSION_MISMATCH) and nothing is changed for it"
    type: postgresVersion
    workflows:
      day0: required
      create-instance: required
      upgrade: optional
      patch: guard
      backup: guard
      scale: guard
      delete-instance: guard
      delete-apps: guard
      network-policy: guard
    fleet: [.instance.postgresVersion]
    format: postgresVersion
  highAvailability:
    doc: "true: primary and standby (plus readReplicas); false: a single node"
    type: boolean
    workflows: {day0: required, create-instance: required}
    fleet: [.instance.highAvailability.enabled]
    format: boolean
  readReplicas:
    doc: "Read replicas: 1 or more with highAvailability true, 0 with false"
    type: integer
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.highAvailability.readReplicas]
    format: number
  storageSize:
    doc: "Size of the data volume"
    type: quantity
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.storageSize]
  walStorageSize:
    doc: "Size of the WAL volume"
    type: quantity
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.walStorageSize]
  storageClass:
    doc: "StorageClass of the volumes"
    type: name
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.storageClassName]
  cpu:
    doc: "CPU request and limit of the database container"
    type: quantity
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.resources.data.requests.cpu, .instance.resources.data.limits.cpu]
  memory:
    doc: "Memory request and limit of the database container"
    type: quantity
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.resources.data.requests.memory, .instance.resources.data.limits.memory]
  backupSchedule:
    doc: "fleet: the backup CronWorkflows; none: no scheduled backups; operator: PostgresBackupSchedule objects (operatorFullSchedule, operatorIncrementalSchedule)"
    # fleet: included in the backup CronWorkflows; none: backup.scheduled false;
    # operator: backup.scheduled false and backup.operatorSchedules (PostgresBackupSchedule
    # objects, design decision D70), written by fleet-day0.sh
    type: enum
    values: [fleet, none, operator]
    workflows: {day0: optional, create-instance: optional}
  operatorFullSchedule:
    doc: "backupSchedule operator: the cron of the full backups (UTC)"
    # backupSchedule=operator: backup.operatorSchedules.full
    type: cron
    workflows: {day0: optional, create-instance: optional}
  operatorIncrementalSchedule:
    doc: "backupSchedule operator: the cron of the incremental backups (UTC); none or an empty value: no incremental schedule"
    # backupSchedule=operator: backup.operatorSchedules.incremental; none (or an
    # empty value) renders the full schedule only
    type: cron
    allowNone: true
    workflows: {day0: optional, create-instance: optional}
  # ---- FerretDB (design decision D71): the ferret block of the instance entry,
  # written by fleet-day0.sh only when ferret is true (false removes the block)
  ferret:
    doc: "true: a FerretDB for the instance; false: none (removes it)"
    type: boolean
    workflows: {day0: optional, create-instance: optional}
  ferretReplicas:
    doc: "FerretDB read-write proxies, 1 or more"
    type: posint
    workflows: {day0: optional, create-instance: optional}
  ferretReadOnlyReplicas:
    doc: "FerretDB read-only proxies (above 0 needs highAvailability true)"
    type: integer
    workflows: {day0: optional, create-instance: optional}
  ferretExposure:
    doc: "FerretDB Services: clusterIP, internalLoadBalancer or loadBalancer"
    type: enum
    values: [clusterIP, internalLoadBalancer, loadBalancer]
    workflows: {day0: optional, create-instance: optional}
  ferretSecretName:
    doc: "FerretDB connection Secret (default: the operator's <instance>-app-user-db-secret)"
    type: k8sName
    workflows: {day0: optional, create-instance: optional}
  ferretReadOnlySecretName:
    doc: "FerretDB read-only connection Secret (default: <instance>-read-only-user-db-secret)"
    type: k8sName
    workflows: {day0: optional, create-instance: optional}
  backupEnableSSL:
    doc: "Backups over HTTPS (spec.storage.azure.enableSSL); the CA bundle comes from backupCaBundleFile, backupCaBundleVaultSecret or ConfigMap tpg-settings backupCaBundle. Renamed from enableSSL in Round 15"
    # PostgresBackupLocation enableSSL (renamed from enableSSL in Round 15)
    type: boolean
    workflows: {day0: optional, create-instance: optional}
    fleet: [.backup.enableSSL]
    format: boolean
  namespace:
    doc: "Round 23: the namespace of the instance, default pg-<instance>; written to clusters/fleet.yaml as instance.namespace and immutable (a different value for an instance that exists is refused). Instances may share a namespace: the first one owns the shared Secrets (regsecret, backup-storage, ServiceAccount tpg-vso), each has its own network policy selected by the postgres-instance label, and purgeNamespace is refused while another instance of the namespace remains. Reserved namespaces (every namespace the fleet installs into, and any name starting with kube-) are refused. Every other workflow reads the namespace from clusters/fleet.yaml"
    # chart value instance.namespace (templates/_helpers.tpl tpg.required); the tpg-instances
    # ApplicationSet destination.namespace. The one list of namespaces an instance may not use
    # (workflows/scripts/clustermap.py, the clusterMap schemas, tpg-aks-infra 60-verify.sh and
    # docs/workflow-commands.md read it from here): every namespace the fleet installs into,
    # that is the Kubernetes system namespaces, Argo CD (argocd) and Argo Workflows (argo),
    # Vault (vault), the Vault Secrets Operator (vault-secrets-operator-system) and its
    # VaultAuth/VaultConnection namespace (tpg-vault), cert-manager, the monitoring stack
    # (monitoring; the Azure option installs into kube-system), the Tanzu Postgres operator
    # (OPERATOR_NS in workflows/scripts/lib.sh, chart value network.operatorNamespace) and
    # default (the tpg-platform Application); and every name starting with a reservedPrefixes
    # entry (kube-: the Kubernetes system namespaces and any other the cluster keeps for itself)
    type: namespace
    reserved: [kube-system, kube-public, kube-node-lease, default, argocd, argo, vault, vault-secrets-operator-system, tpg-vault, cert-manager, monitoring, tanzu-postgres-operator]
    reservedPrefixes: [kube-]
    flag: ""
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.namespace]
  disableInitialBackup:
    doc: "Round 22: true writes the annotation sql.tanzu.vmware.com/skip-initial-backup: \"true\" on the new Postgres instance, so the operator takes no initial backup at creation; false (the default) leaves the operator's behaviour. Only new instances"
    # chart value instance.disableInitialBackup; templates/postgres.yaml writes the annotation only when true
    type: boolean
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.disableInitialBackup]
    format: boolean
  backupCaBundleFile:
    doc: "The backup CA bundle of this instance (backupEnableSSL true): a PEM file of the submitting machine (its contents in patchFiles) or repo:ca-bundles/<file>. Wins over the cluster level and the inputs; not together with backupCaBundleVaultSecret"
    # enableSSL instances (Round 15, D86): the CA bundle of the storage account as a
    # PEM file of the submitting machine (contents in patchFiles) or
    # repo:ca-bundles/<file>. The most specific level wins (instance key, cluster
    # key, input); a file and a Vault secret on one level are refused.
    # tpg-patch: replaces the bundle of running enableSSL instances
    type: caFile
    repoDir: ca-bundles/
    flag: ""
    workflows: {day0: optional, create-instance: optional, patch: optional}
  backupCaBundleVaultSecret:
    doc: "The backup CA bundle of this instance from Vault tpg/ca-bundles/<name> (key caBundle). Wins over the cluster level and the inputs; not together with backupCaBundleFile"
    # the CA bundle from Vault: tpg/ca-bundles/<name>, key caBundle (Round 15, D86;
    # tpg-aks-infra scripts/vault-secret.sh ca put <name> <file> writes it)
    type: k8sName
    flag: ""
    workflows: {day0: optional, create-instance: optional, patch: optional}
  backupFullRetention:
    doc: "Full backups the backup location keeps (retentionPolicy.fullRetention.number), 1 or more"
    # PostgresBackupLocation retentionPolicy.fullRetention.number (Round 15, D84): a
    # count of full backups, or days with backupFullRetentionType time
    type: posint
    workflows: {day0: optional, create-instance: optional}
    fleet: [.backup.fullRetention]
    format: number
  backupFullRetentionType:
    doc: "count: backupFullRetention is a number of full backups; time: a number of days"
    type: enum
    values: [count, time]
    workflows: {day0: optional, create-instance: optional}
    fleet: [.backup.fullRetentionType]
  postgresPatchFilePath:
    doc: "One or more files (a list) of Postgres, PostgresBackupLocation, PostgresBackupSchedule and PostgresFerretDocumentDB documents, one document per object: paths of the submitting machine (their contents in patchFiles) or repo:helm_artifacts/instance/tpg-instance/patches/<file>. Combined into one stored file helm_artifacts/instance/tpg-instance/patches/<instance>-postgres-<hash>.yaml; the objects a run does not send are carried over from the current file. Applied on top of the overlay of tpg-day0 and tpg-create-instance"
    # a list of partial manifests, one Tanzu Postgres kind per document (Postgres,
    # PostgresBackupLocation, PostgresBackupSchedule, PostgresFerretDocumentDB; at
    # most one per kind, and per schedule object): files of the submitting machine
    # (contents in patchFiles) or repo:helm_artifacts/instance/tpg-instance/patches/<file>. Combined
    # into one stored multi-document file, recorded as patches.postgres.current
    # (Round 15, design decision D81); the kinds a run does not send are carried over
    type: patchFileList
    repoDir: helm_artifacts/instance/tpg-instance/patches/
    workflows: {patch: optional}
  postgresOverlayFilePath:
    doc: "Round 22 (tpg-day0, tpg-create-instance; was postgresPatchFilePath): one or more files (a list) of Postgres, PostgresBackupLocation, PostgresBackupSchedule and PostgresFerretDocumentDB documents, one document per object: paths of the submitting machine (their contents in patchFiles) or repo:helm_artifacts/instance/tpg-instance/overlays/<file>. Combined into one stored file helm_artifacts/instance/tpg-instance/overlays/<instance>-postgres-<hash>.yaml, recorded as overlays.postgres.current and applied at the initial deployment"
    type: patchFileList
    repoDir: helm_artifacts/instance/tpg-instance/overlays/
    workflows: {create-instance: optional, day0: optional}
  postgresValuesPatchFilePath:
    doc: "A tpg-instance chart values file: a path of the submitting machine or repo:helm_artifacts/instance/tpg-instance/patches/<file>, stored as helm_artifacts/instance/tpg-instance/patches/<name>-<uid>.yaml. Renamed from valuesPatchFilePath in Round 15; applied on top of the overlay"
    # tpg-instance chart values (renamed from valuesPatchFilePath in Round 15),
    # recorded as patches.postgresValues.current
    type: patchFile
    repoDir: helm_artifacts/instance/tpg-instance/patches/
    workflows: {patch: optional}
  postgresValuesOverlayFilePath:
    doc: "Round 22 (tpg-day0, tpg-create-instance; was postgresValuesPatchFilePath): a tpg-instance chart values file: a path of the submitting machine or repo:helm_artifacts/instance/tpg-instance/overlays/<file>, stored as helm_artifacts/instance/tpg-instance/overlays/<name>-<uid>.yaml and recorded as overlays.postgresValues.current"
    type: patchFile
    repoDir: helm_artifacts/instance/tpg-instance/overlays/
    workflows: {create-instance: optional, day0: optional}
  patchMode:
    doc: "apply or clear, for the patch files of this instance"
    type: enum
    values: [apply, clear]
    workflows: {patch: optional}
  clearKinds:
    doc: "patchMode=clear: the kinds whose current file or documents are removed: Postgres, PostgresBackupLocation, PostgresBackupSchedule, PostgresFerretDocumentDB, postgresValues, or all"
    # patchMode=clear: the kinds whose current patch is removed from this instance
    type: kindList
    workflows: {patch: optional}
  backupType:
    doc: "As the backupType input"
    type: enum
    values: [full, incremental, differential]
    workflows: {backup: optional}
  backupTimeoutSeconds:
    doc: "As the backupTimeoutSeconds input, for this instance"
    type: posint
    workflows: {backup: optional}
  replicas:
    doc: "Read replicas to scale to (required: the key or the input replicas)"
    type: integer
    workflows: {scale: required}
  enableHAIfNeeded:
    doc: "As the input: turn high availability on when replicas is above 0"
    type: boolean
    workflows: {scale: optional}
  preUpgradeBackup:
    doc: "As the input"
    type: boolean
    workflows: {upgrade: optional}
  allowMajor:
    doc: "As the input: allow a major Postgres upgrade"
    type: boolean
    workflows: {upgrade: optional}
  purgePvcs:
    doc: "As the input: delete the volumes"
    type: boolean
    workflows: {delete-instance: optional, delete-apps: optional}
  purgeNamespace:
    doc: "As the input: delete the namespace (needs purgePvcs true). Refused (NAMESPACE_SHARED) while another instance of clusters/fleet.yaml, or another Postgres, uses the namespace; tpg-delete-apps deletes a shared namespace after the last instance of the run, and with deleteOperator whoever else is there"
    type: boolean
    workflows: {delete-instance: optional, delete-apps: optional}
  finalBackup:
    doc: "As the input: true (a final backup, best effort), false (none) or required (fail when the instance is not Running)"
    type: enum
    values: ["true", "false", required]
    workflows: {delete-instance: optional, delete-apps: optional}
  purgeBackups:
    doc: "Round 23. tpg-delete-instance, tpg-delete-apps: as the input - expire every PostgresBackup of the instance while it runs, then delete every blob left under its container and repoPath after it is gone (irreversible; needs finalBackup false; a repoPath another PostgresBackupLocation on any registered cluster uses is expired only, blobs kept and reported). tpg-backup-expire: true expires every backup of the instance and never deletes blobs; not together with backups"
    type: boolean
    workflows: {delete-instance: optional, delete-apps: optional, backup-expire: optional}
  backups:
    doc: "Round 23, tpg-backup-expire: the PostgresBackup names to expire (a list in brackets, [orders-db-full-202609010100]). A full backup that has dependent differential or incremental backups needs includeDependents: true (else the instance is BLOCKED and the dependents are listed). Not together with purgeBackups"
    type: k8sNameList
    flag: ""
    workflows: {backup-expire: optional}
  includeDependents:
    doc: "Round 23, tpg-backup-expire: true also expires the differential and incremental backups that depend on the listed ones (dependents first); required to expire a backup that has dependents. With backups only"
    type: boolean
    flag: ""
    workflows: {backup-expire: optional}
  # ---- exposure (design decision D64): how the instance's Services are
  # published. The chart turns exposure into spec.serviceType and the Azure
  # load balancer annotations; serviceAnnotations are added as given.
  exposure:
    doc: "Read-write Service: clusterIP, internalLoadBalancer or loadBalancer"
    type: enum
    values: [clusterIP, internalLoadBalancer, loadBalancer]
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.exposure]
  serviceAnnotations:
    doc: "Extra annotations of the read-write Service"
    type: stringMap
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.serviceAnnotations]
    format: map
  readOnlyExposure:
    doc: "Read-only Service: clusterIP, internalLoadBalancer or loadBalancer"
    type: enum
    values: [clusterIP, internalLoadBalancer, loadBalancer]
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.readOnlyExposure]
  readOnlyServiceAnnotations:
    doc: "Extra annotations of the read-only Service"
    type: stringMap
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.readOnlyServiceAnnotations]
    format: map
  allowedSourceRanges:
    doc: "Client ranges a load balancer accepts"
    # Both load balancer Services: service.beta.kubernetes.io/azure-allowed-ip-ranges
    type: cidrList
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.allowedSourceRanges]
    format: list
  internalLoadBalancerSubnet:
    doc: "Subnet of an internal load balancer"
    type: azureName
    workflows: {day0: optional, create-instance: optional}
    fleet: [.instance.internalLoadBalancerSubnet]
  # ---- network policy (design decision D65): default deny plus the flows the
  # instance needs, then these client rules. networkPolicy none renders nothing.
  networkPolicy:
    doc: "none or baseline (default deny with the allowed clients)"
    # tpg-network-policy sets baseline itself (mode apply or update)
    type: enum
    values: [none, baseline]
    workflows: {day0: optional, create-instance: optional}
    fleet: [.network.policy]
  ingressFromNamespaces:
    doc: "Namespaces whose pods may reach 5432"
    type: nameList
    workflows: {day0: optional, create-instance: optional, network-policy: optional}
    fleet: [.network.ingressFromNamespaces]
    format: list
  ingressFromPodLabels:
    doc: "Pod labels allowed to reach 5432"
    type: stringMap
    workflows: {day0: optional, create-instance: optional, network-policy: optional}
    fleet: [.network.ingressFromPodLabels]
    format: map
  ingressFromCidrs:
    doc: "Client ranges allowed to reach 5432"
    type: cidrList
    workflows: {day0: optional, create-instance: optional, network-policy: optional}
    fleet: [.network.ingressFromCidrs]
    format: list
  egressToCidrs:
    doc: "Extra egress ranges"
    type: cidrList
    workflows: {day0: optional, create-instance: optional, network-policy: optional}
    fleet: [.network.egressToCidrs]
    format: list
  egressToFqdns:
    doc: "Egress host names (needs ACNS)"
    # CiliumNetworkPolicy toFQDNs: needs ACNS (Terraform acns_enabled = true)
    type: fqdnList
    workflows: {day0: optional, create-instance: optional, network-policy: optional}
    fleet: [.network.egressToFqdns]
    format: list

restore:
  source:
    sourceBackupName:
      doc: "The PostgresBackup to restore, in the namespace of the source instance. Mandatory when the target restores a named backup (pitrEnabled false, which is the default when pitrEnabled is absent): PostgresRestore spec.sourceBackup.name, into the same namespace, another namespace or another cluster (the workflow re-creates the source PostgresBackupLocation in the target namespace, and the operator syncs the backups of that name there). With pitrEnabled true it only names the backup that gives the backup location and the stanza when the source instance no longer exists"
      type: k8sName
  target:
    pitrEnabled:
      doc: "Default false. true: point-in-time recovery from the backup repository (PostgresRestore spec.pitr; pitrConfig.type says to where); false, or absent: restore the backup named by sourceBackupName of the source (spec.sourceBackup), which is then mandatory"
      type: boolean
    pitrConfig.type:
      doc: "pitrEnabled true, mandatory: latest (newest WAL), time (pitrConfig.timestamp), lsn or transaction (pitrConfig.target)"
      type: enum
      values: [latest, time, lsn, transaction]
    pitrConfig.target:
      doc: "type lsn: a log sequence number such as 0/3000060; type transaction: a transaction ID (a number); mandatory for those two types, refused for the others (spec.pitr.target)"
      type: string
    pitrConfig.timestamp:
      doc: "type time, mandatory: a UTC time such as 2026-09-15T08:30:00Z (spec.pitr.timestamp); refused for the other types"
      type: timestamp
    pitrConfig.sourceBackupConfig.srcBackupLocationName:
      doc: "The PostgresBackupLocation that holds the backups (spec.pitr.sourceBackupLocation.name). Optional: derived from the source instance, or from the backup sourceBackupName names; a difference from what the source reports is a warning. Mandatory when there is neither a live source instance nor a sourceBackupName"
      type: k8sName
    pitrConfig.sourceBackupConfig.srcStanzaName:
      doc: "The pgBackRest stanza (spec.pitr.sourceBackupLocation.stanzaName). Optional and derived as srcBackupLocationName; mandatory under the same condition"
      type: stanzaName
    pitrConfig.sourceBackupConfig.srcBackupLabel:
      doc: "The pgBackRest backup to start the recovery from, such as 20260915-020000F or 20260916-010000I as in pgBackRest info (spec.pitr.sourceBackupLocation.set). Refused with type latest; empty: the newest backup before the recovery point"
      type: backupLabel
    bestEffort:
      doc: "pitrEnabled true: mandatory for time, lsn and transaction (true: recover as far as the WAL allows when the target is invalid or not reached; false: fail instead), refused for latest and with pitrEnabled false (spec.pitr.bestEffort)"
      type: boolean
    targetInstanceSpecFilePath:
      doc: "The spec of the restored Postgres instance: one file with exactly one kind: Postgres document, in brackets, [./orders-dr.yaml] (a file of the submitting machine, its contents in patchFiles) or [repo:helm_artifacts/instance/tpg-instance/restore-specs/<file>] in the fleet repository (that folder only). Its spec is the source of truth: it is rendered as it is as spec.targetInstance.spec of the PostgresRestore (not merged over a chart render) and stored in the fleet repository as the instance's restore-patch, which Argo CD's chart renders the restored instance from (no chart default is filled in). Allowed for a new target and for an in-place restore (it overrides the existing instance's values). Without it a new target copies the source instance's entry of clusters/fleet.yaml and the operator fills the instance spec; an in-place restore sends only spec.targetInstance.name; either way the spec read from the cluster after the restore is stored as the restore-patch. Mandatory when the new target's source is not in fleet.yaml"
      type: patchFile
      repoDir: helm_artifacts/instance/tpg-instance/restore-specs/
    confirm:
      doc: "The target instance name, repeated. Only for an in-place restore (source and target are the same cluster, namespace and instance), where it is mandatory for a real restore (dryRun false): the restore overwrites the instance's data. Refused on any other pair as meaningless: a restore into another instance never overwrites one, and a target that already exists is refused at plan time (TARGET_EXISTS: restore in place or choose a new instance name). A name that is not the target instance is always refused. The schema cannot compare the two sides, so validate-params.sh enforces it"
      type: name
    skipMinorVersionCheck:
      doc: "true writes the annotation sql.tanzu.vmware.com/skip-minor-version-check: \"true\" on the PostgresRestore (default false)"
      type: boolean
    postRestoreBackup:
      doc: "true takes a full backup of the target once the restored instance runs (default false)"
      type: boolean
