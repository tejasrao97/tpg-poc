# Example of a filled-in clusters/fleet.yaml (not read by Argo CD or the
# workflows). tpg-day0 and tpg-create-instance write these entries and record the
# overlay files (Round 22); tpg-patch records the patch files (current, and the
# previous one with the commit that added it; Round 14), which apply after the
# overlays; tpg-network-policy writes network.
# See clusters/fleet.yaml for the layout.
clusters:
  aks-tpg-poc-01:
    operator:
      version: v4.5.0
      patches:
        values:
          current: helm_artifacts/operator/patches/example-operator-values-ex4m3.yaml
    instances:
      orders-db:
        instance:
          postgresVersion: postgres-17.6
          highAvailability:
            enabled: true
            readReplicas: 1
        patches:
          postgres:
            current: patches/example-postgres-resources-ex4m1.yaml
      billing-db:
        instance:
          # tpg-day0 / tpg-create-instance clusterMap key namespace (Round 23; default
          # pg-billing-db): instances may share a namespace. billing-db owns the shared
          # Secrets (regsecret, backup-storage, ServiceAccount tpg-vso) of finance
          namespace: finance
          postgresVersion: postgres-17.6
          highAvailability:
            enabled: false
            readReplicas: 0
        backup:
          scheduled: false
        overlays:
          postgresValues:
            current: overlays/example-values-retention-ov1v1.yaml
      billing-reports:
        instance:
          namespace: finance
          # false: another instance of the namespace renders the shared Secrets
          # (written by the workflows; one owner per namespace)
          sharedSecretsOwner: false
          postgresVersion: postgres-17.6
          highAvailability:
            enabled: false
            readReplicas: 0
  aks-tpg-poc-02:
    operator:
      version: v4.5.0
      overlays:
        values:
          current: helm_artifacts/operator/overlays/example-operator-overlay-ov1o1.yaml
    instances:
      orders-db:
        instance:
          postgresVersion: postgres-17.6
          storageSize: 50Gi
          # tpg-day0 / tpg-create-instance input exposure (design decision D64)
          exposure: internalLoadBalancer
          allowedSourceRanges:
            - 10.20.0.0/16
        # tpg-network-policy, or the networkPolicy input (design decision D65)
        network:
          policy: baseline
          acns: false
          ingressFromNamespaces:
            - orders-app
        patches:
          postgresValues:
            current: patches/example-values-backup-ex4m2.yaml
            previous:
              path: patches/example-values-retention-ex4m0.yaml
              commit: 4f2c1e9a7b3d5c8e0f1a2b3c4d5e6f7a8b9c0d1e
      # tpg-restore with a spec file (targetInstanceSpecFilePath, Round 23): the new instance copies the
      # entry of its source and records the spec file it was restored with as restorePatch, which the
      # chart applies last (after the overlay and the patch); a later tpg-patch moves it to previous
      orders-db-dr:
        instance:
          namespace: orders-dr
          postgresVersion: postgres-17.6
          storageSize: 50Gi
        restorePatch:
          current: restore-patch/example-restore-orders-db-dr1x7.yaml
          previous:
            path: restore-patch/example-restore-orders-db-dr0a2.yaml
            commit: 9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a39281706
