# Argo Workflows Helm values for the hub cluster
# (chart argo/argo-workflows 2.0.6, Argo Workflows v4.1.3).
# server.loadBalancerSourceRanges is injected by scripts/00-install-argo.sh.

controller:
  # Workflows run only in the argo namespace.
  workflowNamespaces:
    - argo
  metricsConfig:
    enabled: true
  serviceMonitor:
    # Set to true only when the Prometheus Operator CRDs exist on the hub
    # (standalone monitoring option).
    enabled: false
  workflowDefaults:
    spec:
      serviceAccountName: tpg-workflow
      ttlStrategy:
        secondsAfterCompletion: 604800
      podGC:
        strategy: OnPodSuccess

server:
  serviceType: LoadBalancer
  servicePort: 2746
  loadBalancerSourceRanges: []
  # HTTPS with a self-signed certificate generated by the server.
  secure: true
  # UI and CLI log in with a Kubernetes bearer token.
  authModes:
    - client

workflow:
  # The tpg-workflow ServiceAccount and its RBAC are delivered by the
  # tpg-fleet repository (workflows/rbac.yaml).
  serviceAccount:
    create: false
  rbac:
    create: false
